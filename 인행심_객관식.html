<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기말고사 대비 실전 모의고사 (10문항)</title>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 40px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
        }
        .question-card {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .question-number {
            font-weight: bold;
            color: #1a73e8;
            font-size: 1.1em;
            margin-bottom: 10px;
            display: block;
        }
        .question-text {
            font-size: 1.15em;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .option-item {
            margin-bottom: 12px;
        }
        .option-btn {
            width: 100%;
            text-align: left;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s ease;
            position: relative;
        }
        .option-btn:hover {
            background-color: #f8f9fa;
            border-color: #1a73e8;
        }
        .option-btn.selected {
            border-width: 2px;
        }
        
        /* Feedback Styles */
        .feedback {
            margin-top: 10px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none; /* Hidden by default */
        }
        .feedback.correct {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }
        .feedback.incorrect {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
        }
        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        /* State colors for buttons */
        .option-btn.correct-choice {
            background-color: #e6f4ea;
            border-color: #137333;
            color: #137333;
        }
        .option-btn.incorrect-choice {
            background-color: #fce8e6;
            border-color: #c5221f;
            color: #c5221f;
        }
        
        /* New Navigation Button Style */
        .page-nav {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .page-nav a {
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s;
            display: inline-block;
        }
        .page-nav a:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>기말고사 대비 실전 모의고사</h1>
    <p style="text-align: center; color: #666; margin-bottom: 30px;">
        각 문제의 선지를 클릭하면 정답 여부와 상세한 해설을 바로 확인할 수 있습니다.
    </p>

    <div id="quiz-area">
        </div>

    <div class="page-nav">
        <a href="index.html">단답형/빈칸 통합 퀴즈로 이동</a>
    </div>

</div>

<script>
    const quizData = [
        {
          id: 1,
          question: "피아제(Piaget)의 인지 발달 단계 중 만 7세 이상이 되어 진입하는 '구체적 조작기(Concrete Operational Stage)'에 대한 설명 중 가장 옳은 것은?",
          options: [
            {
              text: "사물을 하나의 기준으로만 판단하는 중심화(Centration) 경향이 소멸되지 않고 지속된다.",
              correct: false,
              feedback: "중심화는 전조작기(Preoperational Stage)의 특징이며, 구체적 조작기에 들어서면 여러 기준을 고려하는 탈중심화가 가능해집니다.",
            },
            {
              text: "비가역성(Irreversibility)을 극복하고, 정신적 조작을 역으로 되돌릴 수 있는 가역적 사고 능력을 획득한다.",
              correct: true,
              feedback: "정답입니다. 구체적 조작기의 아동은 비가역성을 극복하고 가역적 사고를 통해 보존 개념(Conservation)을 완전히 이해하게 됩니다.",
            },
            {
              text: "가설을 세우고 연역적인 추론을 통해 문제를 해결하는 형식적 조작을 시작한다.",
              correct: false,
              feedback: "가설연역적 사고와 추상적 사고는 만 11세 이후의 형식적 조작기(Formal Operational Stage)의 핵심 특징입니다.",
            },
            {
              text: "새로운 정보를 기존 도식에 맞추어 해석하는 조절(Accommodation)보다 도식을 수정하는 동화(Assimilation)가 두드러진다.",
              correct: false,
              feedback: "동화와 조절은 인지 발달의 전 과정에서 상호작용하며, '동화'는 정보를 기존 도식에 맞추고, '조절'은 도식을 수정하는 과정입니다. 설명된 내용 중 동화와 조절의 정의가 바뀌었으며, 이 시기에 특정 기제가 두드러진다고 단정하기 어렵습니다.",
            },
            {
              text: "상징적 사고가 가능해지며, 언어 사용 능력의 폭발적인 증가를 보인다.",
              correct: false,
              feedback: "상징적 사고의 시작과 언어의 급격한 발달은 만 2~7세에 해당하는 전조작기에 주로 나타나는 특징입니다.",
            },
          ],
        },
        {
          id: 2,
          question: "인지 부조화 이론은 태도와 행동의 차이를 최소화하여 인지 일관성을 이루고자 한다는 이론이다. 다음 중 인지 부조화 해소를 위한 **'태도 변화'**의 예로 가장 적절한 것은?",
          options: [
            {
              text: "환경 보호가 중요하다고 생각하면서도 일회용품을 사용한 후, 환경 단체에 기부하는 행동으로 불편함을 상쇄한다.",
              correct: false,
              feedback: "이는 불일치한 행동을 정당화하기 위해 일치하는 인지(조화 인지)를 추가하는 전략이며, 태도(환경 보호 중요성) 자체가 변한 것은 아닙니다.",
            },
            {
              text: "거액의 돈을 받고 자신이 거짓말했다는 사실을 잊어버리려 노력하는 것.",
              correct: false,
              feedback: "거액의 보상은 행동을 정당화하는 '외부적 이유'가 충분하므로 인지 부조화가 발생하지 않거나 약해져 태도 변화가 잘 일어나지 않습니다.",
            },
            {
              text: "노력에 비해 보상이 적은 지루한 과제를 수행한 후, 나중에 그 과제가 '사실은 꽤 흥미로웠다'고 스스로 생각하게 되는 것.",
              correct: true,
              feedback: "정답입니다. 낮은 보상(불충분한 정당화)은 외부적 정당화가 부족하여 내적 일관성을 확보하기 위해 태도(과제에 대한 평가) 자체를 변화시키는 인지 부조화 해소의 전형적인 예시입니다.",
            },
            {
              text: "흡연의 해로움에 대해 듣고도 담배를 끊지 않는 대신, 흡연과 관련된 건강 위험 정보를 무시하고 중요성을 평가절하하는 것.",
              correct: false,
              feedback: "이는 불일치하는 인지의 '중요도 격하' 전략이며, 태도(흡연에 대한 평가)가 변한 것은 아닙니다.",
            },
            {
              text: "타인의 부정적인 행동을 보았을 때, 상황적 요인 대신 그 사람의 성격 탓으로 돌려버리는 것.",
              correct: false,
              feedback: "이는 기본적 귀인 오류(Fundamental Attribution Error) 또는 대응 편향의 예시이며, 인지 부조화 해소 전략은 아닙니다.",
            },
          ],
        },
        {
          id: 3,
          question: "다음 중 한국 사회에서 불공정성을 인식할 때 나타나는 '상대적 박탈감(Relative Deprivation)'을 가장 잘 보여주는 사례는 무엇인가?",
          options: [
            {
              text: "빈곤층에 속한 A가 당장의 생계 문제에 대한 절망감으로 사회를 원망하는 경우.",
              correct: false,
              feedback: "이는 절대적인 궁핍에서 오는 '절대적 박탈감'에 가깝거나, 사회 원망은 하지만 비교의 요소가 명확하지 않습니다.",
            },
            {
              text: "열심히 노력했지만 입사에 실패한 B가 모든 원인을 자신의 능력 부족으로 돌리는 경우.",
              correct: false,
              feedback: "이는 결과를 내부 요인으로 돌리는 성향 귀인(Dispositional Attribution)으로, 외부의 불공정성 인식이 핵심인 상대적 박탈감과는 거리가 있습니다.",
            },
            {
              text: "직장인 C가 자신의 소득 수준은 나쁘지 않지만, 자신과 비슷한 배경을 가진 동료가 불공정한 기회로 인해 훨씬 빠른 승진을 한 것에 분노하는 경우.",
              correct: true,
              feedback: "정답입니다. 자신의 객관적 상태와 상관없이, 적절한 준거 집단(동료)과의 불공정한 비교를 통해 열등감을 느끼는 것이 상대적 박탈감의 핵심입니다.",
            },
            {
              text: "개인 투자자 D가 주식 시장의 폭락으로 큰 손해를 보았으나, '원래 투자는 리스크가 있다'며 담담하게 받아들이는 경우.",
              correct: false,
              feedback: "이는 손실을 수용하거나 합리화하는 것에 가깝습니다.",
            },
            {
              text: "평생을 열심히 살아온 노인 E가 사회적 지지 부족으로 외로움을 느끼는 경우.",
              correct: false,
              feedback: "이는 사회적 지지 부족으로 인한 정서적 문제입니다.",
            },
          ],
        },
        {
          id: 4,
          question: "스트레스에 관한 설명 중 틀린 것은?",
          options: [
            {
              text: "Selye의 일반적 적응 증후군(GAS)에서 신체의 저항력은 저항 단계(Resistance)에서 가장 높은 수준을 보인다.",
              correct: false,
              feedback: "맞습니다. 저항 단계는 스트레스에 맞서 적응하려는 단계로, 이때 신체의 저항력이 최고조에 달합니다.",
            },
            {
              text: "스트레스 반응은 카테콜라민(에피네프린, 노르에피네프린) 및 코르티솔과 같은 호르몬 분비를 촉진한다.",
              correct: false,
              feedback: "맞습니다. 이 호르몬들은 교감신경계를 활성화하고 장기적인 스트레스 반응에 관여합니다.",
            },
            {
              text: "일상의 작은 스트레스(Daily Hassles)는 삶의 큰 사건(Life Events)보다 건강에 더 부정적인 영향을 미칠 수 있다.",
              correct: false,
              feedback: "맞습니다. 빈번하고 만성적인 일상 스트레스가 누적될 경우, 단발적인 큰 사건보다 더 해로울 수 있습니다.",
            },
            {
              text: "유스트레스(Eustress)는 긍정적 결과를 유도하므로, 생물학적으로는 신체에 어떠한 긴장이나 부하도 주지 않는다.",
              correct: true,
              feedback: "정답입니다. 유스트레스 역시 '스트레스'의 일종이므로, 긍정적인 맥락일지라도 심박수 증가나 호르몬 분비 등 생물학적 긴장(각성)을 유발합니다.",
            },
            {
              text: "스트레스 반응의 초기인 경고 단계(Alarm)에서는 신체적 저항력이 일시적으로 감소한다.",
              correct: false,
              feedback: "맞습니다. 경고 단계는 최초의 충격으로, 일시적으로 신체의 저항력이 떨어졌다가 저항 단계로 넘어갑니다.",
            },
          ],
        },
        {
          id: 5,
          question: "프로이트의 설명에 의하면 인간이 불안 심리를 가질 때, 이를 해소하고자 방어기제를 사용한다. 다음 설명 중 프로이트의 방어기제라고 **볼 수 없는** 것은?",
          options: [
            {
              text: "정서적으로 받아들이기 힘든 자신의 문제나 욕구를 논리적이고 추상적인 사고로 대체하여 분석하려는 주지화(Intellectualization).",
              correct: false,
              feedback: "주지화는 정서적 고통을 회피하기 위해 지적으로 분석하는 방어기제입니다.",
            },
            {
              text: "스트레스로 인해 현재의 발달 수준보다 미숙하고 의존적인 과거의 행동 양상으로 돌아가는 퇴행(Regression).",
              correct: false,
              feedback: "퇴행은 불안에 대처하기 위해 이전 단계로 되돌아가는 방어기제입니다.",
            },
            {
              text: "타인의 행동이나 상황적 요인을 고려하지 않고, 행위자의 내적 특질이나 태도에 귀인하는 대응 편향(Correspondence Bias).",
              correct: true,
              feedback: "정답입니다. 대응 편향(기본적 귀인 오류)은 사회 심리학의 '귀인 이론'에서 나오는 인지적 편향이지, 프로이트의 '방어기제'는 아닙니다.",

              feedback: "승화는 본능적 욕구를 건설적인 방향으로 돌리는 방어기제입니다.",

        },

              text: "국가 법률의 정당성이나 목적과 무관하게, 법은 사회 질서를 위해 절대적으로 지켜야 한다고 판단하는 공무원.",

              feedback: "이는 5단계(사회계약과 개인의 권리)로 후인습적 수준이지만, 6단계보다는 낮은 수준입니다.",

          ],
        },

    const quizArea = document.getElementById('quiz-area');

    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const qNum = document.createElement('span');
        qNum.className = 'question-number';
        qNum.textContent = `문제 ${q.id}`;
        card.appendChild(qNum);

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options';

        const feedbackDiv = document.createElement('div');
        feedbackDiv.className = 'feedback';
        const feedbackTitle = document.createElement('span');
        feedbackTitle.className = 'feedback-title';
        const feedbackContent = document.createElement('span');
        feedbackDiv.appendChild(feedbackTitle);
        feedbackDiv.appendChild(feedbackContent);

        q.options.forEach((opt, optIndex) => {
            const li = document.createElement('li');
            li.className = 'option-item';

            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span style="font-weight:bold; margin-right:10px;">${optIndex + 1}.</span> ${opt.text}`;
            
            btn.onclick = () => {
                const allBtns = optionsList.querySelectorAll('.option-btn');
                allBtns.forEach(b => {
                    b.classList.remove('selected', 'correct-choice', 'incorrect-choice');
                });

                btn.classList.add('selected');
                if (opt.correct) {
                    btn.classList.add('correct-choice');
                    feedbackDiv.className = 'feedback correct';
                    feedbackTitle.textContent = "⭕ 정답입니다!";
                } else {
                    btn.classList.add('incorrect-choice');
                    feedbackDiv.className = 'feedback incorrect';
                    feedbackTitle.textContent = "❌ 오답입니다.";
                }

                feedbackContent.textContent = opt.feedback;
                feedbackDiv.style.display = 'block';
            };

            li.appendChild(btn);
            optionsList.appendChild(li);
        });

        card.appendChild(optionsList);
        card.appendChild(feedbackDiv);
        quizArea.appendChild(card);
    });
