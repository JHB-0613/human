<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기말고사 대비 실전 모의고사 (10문항)</title>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 40px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
        }
        .question-card {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .question-number {
            font-weight: bold;
            color: #1a73e8;
            font-size: 1.1em;
            margin-bottom: 10px;
            display: block;
        }
        .question-text {
            font-size: 1.15em;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .option-item {
            margin-bottom: 12px;
        }
        .option-btn {
            width: 100%;
            text-align: left;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s ease;
            position: relative;
        }
        .option-btn:hover {
            background-color: #f8f9fa;
            border-color: #1a73e8;
        }
        .option-btn.selected {
            border-width: 2px;
        }
        
        /* Feedback Styles */
        .feedback {
            margin-top: 10px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none; /* Hidden by default */
        }
        .feedback.correct {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }
        .feedback.incorrect {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
        }
        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        /* State colors for buttons */
        .option-btn.correct-choice {
            background-color: #e6f4ea;
            border-color: #137333;
            color: #137333;
        }
        .option-btn.incorrect-choice {
            background-color: #fce8e6;
            border-color: #c5221f;
            color: #c5221f;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>기말고사 대비 실전 모의고사</h1>
    <p style="text-align: center; color: #666; margin-bottom: 30px;">
        각 문제의 선지를 클릭하면 정답 여부와 상세한 해설을 바로 확인할 수 있습니다.
    </p>

    <div id="quiz-area">
        </div>
</div>

<script>
    const quizData = [
        {
            id: 1,
            question: "피아제(Piaget)의 인지 발달 단계 중 만 7~11세에 해당하는 '구체적 조작기'의 특징으로 가장 적절한 것은?",
            options: [
                { text: "추상적인 가설을 세우고 논리적으로 검증할 수 있다.", correct: false, feedback: "이는 형식적 조작기(11세 이후)의 특징입니다. 구체적 조작기 아동은 구체적인 사물에 대해서만 논리적 사고가 가능합니다." },
                { text: "대상 영속성을 획득하여 눈앞에 보이지 않는 물건을 찾으려 한다.", correct: false, feedback: "대상 영속성은 감각운동기(0~2세)에 획득되는 주요 개념입니다." },
                { text: "보존 개념을 획득하여 컵의 모양이 바뀌어도 물의 양이 같음을 이해한다.", correct: true, feedback: "정답입니다! 구체적 조작기의 가장 큰 특징은 보존 개념의 획득과 가역적 사고가 가능하다는 점입니다." },
                { text: "자아 중심성이 강하여 타인의 관점을 이해하지 못한다.", correct: false, feedback: "자아 중심성은 전조작기(2~7세)의 대표적인 특징입니다. 구체적 조작기에는 이를 탈피하게 됩니다." },
                { text: "감각과 운동 능력을 통해 세상을 이해한다.", correct: false, feedback: "이는 감각운동기(0~2세)의 특징입니다." }
            ]
        },
        {
            id: 2,
            question: "인지부조화 이론(Cognitive Dissonance Theory)에서 태도와 행동의 불일치를 해소하는 방법으로 가장 거리가 먼 예시는?",
            options: [
                { text: "지루한 과제를 하고 적은 보수를 받은 후, '과제가 재미있었다'고 태도를 바꾼다.", correct: false, feedback: "이는 부조화를 줄이기 위해 태도를 변화시키는 전형적인 예시입니다 (불충분한 정당화)." },
                { text: "흡연자가 '흡연은 정신 건강에 도움이 된다'며 합리화한다.", correct: false, feedback: "이는 일치하는 새로운 인지를 추가하여 부조화를 감소시키는 방법입니다." },
                { text: "다이어트 중 폭식을 한 뒤 '어차피 내일 운동할 거니까 괜찮다'고 생각한다.", correct: false, feedback: "이는 행동을 정당화하거나 불일치의 중요성을 낮추는 방식입니다." },
                { text: "환경 오염이 걱정되지만 귀찮아서 분리수거를 하지 않고, 죄책감을 계속 느낀다.", correct: true, feedback: "정답입니다! 이는 부조화 상태가 '유지'되고 있는 것이지 해소된 예시가 아닙니다. 인지부조화 이론은 인간이 이 불편함을 '해소'하려 한다고 설명합니다." },
                { text: "원치 않는 학과에 진학했지만, '이 전공이 전망이 밝다'고 믿어버린다.", correct: false, feedback: "이는 선택을 정당화하여 부조화를 줄이는 방법입니다." }
            ]
        },
        {
            id: 3,
            question: "한국 사회에서 타인과의 비교를 통해 느끼는 '상대적 박탈감(Relative Deprivation)'을 가장 잘 설명하는 사례는?",
            options: [
                { text: "절대적인 빈곤층에 속하여 당장 먹을 끼니를 걱정하는 사람", correct: false, feedback: "이는 '절대적 박탈감' 혹은 생존의 문제입니다. 상대적 박탈감은 비교에서 옵니다." },
                { text: "자신도 연봉이 올랐지만, 동기가 훨씬 더 높은 연봉을 받는 것을 보고 불행하다고 느끼는 직장인", correct: true, feedback: "정답입니다! 자신의 처지가 객관적으로 나쁘지 않더라도, 비교 대상(준거 집단)보다 못하다고 느낄 때 발생하는 것이 상대적 박탈감입니다." },
                { text: "무인도에 혼자 표류하여 구조를 기다리는 사람", correct: false, feedback: "비교 대상이 없는 고립된 상황이므로 상대적 박탈감으로 보기 어렵습니다." },
                { text: "열심히 공부했지만 시험에 떨어져 스스로에게 실망한 학생", correct: false, feedback: "이는 개인적인 좌절감이나 실패감에 가깝습니다. '타인과의 비교' 요소가 명시적이지 않습니다." },
                { text: "모든 국민이 다 같이 가난했던 시절에 겪은 배고픔", correct: false, feedback: "모두가 평등하게 가난한 상황에서는 비교 우위가 없으므로 상대적 박탈감이 적게 나타날 수 있습니다." }
            ]
        },
        {
            id: 4,
            question: "스트레스에 대한 설명 중 틀린 것은?",
            options: [
                { text: "적절한 수준의 스트레스(유스트레스)는 삶의 활력이 될 수 있다.", correct: false, feedback: "맞습니다. 긍정적 스트레스(Eustress)는 성취 동기를 부여합니다." },
                { text: "셀리에(Selye)의 일반적 적응 증후군은 경고-저항-소진 단계를 거친다.", correct: false, feedback: "맞습니다. 스트레스 반응은 경고(Alarm), 저항(Resistance), 소진(Exhaustion) 단계로 진행됩니다." },
                { text: "소진(Exhaustion) 단계에서는 신체의 면역력이 급격히 저하되어 질병에 걸리기 쉽다.", correct: false, feedback: "맞습니다. 지속적인 스트레스로 에너지가 고갈되면 질병 위험이 커집니다." },
                { text: "스트레스 상황에서는 부교감 신경계가 활성화되어 신체를 이완시킨다.", correct: true, feedback: "정답입니다! 스트레스 상황에서는 '교감 신경계'가 활성화되어 투쟁-도피(Fight or Flight) 반응을 준비합니다. 이완은 부교감 신경의 역할입니다." },
                { text: "스트레스원은 물리적 자극뿐만 아니라 심리적 평가에 의해서도 발생한다.", correct: false, feedback: "맞습니다. 라자루스(Lazarus)는 스트레스가 개인의 '인지적 평가'에 달려있다고 했습니다." }
            ]
        },
        {
            id: 5,
            question: "프로이트의 방어기제(Defense Mechanism)에 해당하지 않는 것은?",
            options: [
                { text: "투사 (Projection)", correct: false, feedback: "투사는 자신의 받아들일 수 없는 충동을 타인에게 돌리는 방어기제입니다." },
                { text: "합리화 (Rationalization)", correct: false, feedback: "합리화는 그럴듯한 변명으로 자신의 행동을 정당화하는 방어기제입니다." },
                { text: "승화 (Sublimation)", correct: false, feedback: "승화는 본능적 욕구를 사회적으로 바람직한 형태로 변환하는 성숙한 방어기제입니다." },
                { text: "주도성 (Initiative)", correct: true, feedback: "정답입니다! '주도성'은 에릭슨(Erikson)의 심리사회적 발달 단계(3단계: 주도성 대 죄책감)에서 나타나는 주요 과업이지, 방어기제가 아닙니다." },
                { text: "억압 (Repression)", correct: false, feedback: "억압은 불안을 야기하는 생각을 무의식으로 밀어 넣는 가장 기본적인 방어기제입니다." }
            ]
        },
        {
            id: 6,
            question: "콜버그(Kohlberg)의 도덕성 발달 이론 중 가장 높은 수준인 '후인습적 수준'에 해당하는 판단은?",
            options: [
                { text: "벌을 받지 않기 위해 규칙을 지킨다.", correct: false, feedback: "이는 1단계(처벌과 복종 지향)로 가장 낮은 전인습적 수준입니다." },
                { text: "나에게 이익이 되기 때문에 착한 행동을 한다.", correct: false, feedback: "이는 2단계(도구적 상대주의)로 전인습적 수준입니다." },
                { text: "친구들에게 인정받고 '착한 아이'로 보이고 싶어서 돕는다.", correct: false, feedback: "이는 3단계(대인관계 조화)로 인습적 수준입니다." },
                { text: "법과 사회 질서는 무조건 지켜야 하므로 악법도 법이다.", correct: false, feedback: "이는 4단계(법과 질서 지향)로 인습적 수준입니다." },
                { text: "인간의 생명과 존엄성 같은 보편적 원리에 비추어, 법이 잘못되었다면 어길 수도 있다.", correct: true, feedback: "정답입니다! 이는 6단계(보편적 윤리 원칙)로, 자신의 양심과 보편적 정의에 따라 판단하는 가장 높은 수준입니다." }
            ]
        },
        {
            id: 7,
            question: "다음 중 '집단 극화(Group Polarization)' 현상이 아닌 것은?",
            options: [
                { text: "보수적인 성향의 사람들이 토론 후 더 보수적으로 변했다.", correct: false, feedback: "이는 집단 극화의 전형적인 예시입니다. 기존 성향이 강화되었습니다." },
                { text: "모험적인 투자자들이 회의를 거친 뒤 더욱 위험한 투자를 결정했다.", correct: false, feedback: "이는 '모험 이행'으로 집단 극화의 한 형태입니다." },
                { text: "토론 과정에서 자신의 의견을 지지하는 정보만 공유되어 확신이 강해졌다.", correct: false, feedback: "정보의 영향 및 설득 주장은 집단 극화의 원인 중 하나입니다." },
                { text: "집단의 화합을 해치지 않기 위해 반대 의견을 내지 않고 만장일치로 합의했다.", correct: true, feedback: "정답입니다! 이것은 '집단 사고(Groupthink)'입니다. 집단 극화는 의견이 '양극단'으로 쏠리는 것이고, 집단 사고는 비합리적인 '합의'에 도달하는 현상입니다." },
                { text: "자신의 의견이 타인보다 덜 극단적이라 느끼고 더 강한 주장을 펼쳤다.", correct: false, feedback: "사회적 비교에 의한 자기 과시로, 집단 극화의 원인이 됩니다." }
            ]
        },
        {
            id: 8,
            question: "밀그램(Milgram)의 복종 실험을 현실 상황에서 재현할 때, 복종률을 낮추는 데 가장 영향이 적은(또는 관련 없는) 요인은?",
            options: [
                { text: "지시하는 권위자(연구자)가 물리적으로 멀리 떨어져 있을 때", correct: false, feedback: "권위자가 멀리 있으면 복종률은 현저히 떨어집니다." },
                { text: "희생자(학생)와 같은 방에 있어 고통을 직접 목격할 때", correct: false, feedback: "희생자와의 거리가 가까울수록 복종률은 떨어집니다." },
                { text: "권위자가 평범한 옷을 입고 있어 권위가 없어 보일 때", correct: false, feedback: "권위의 상징성이 낮으면 복종률은 떨어집니다." },
                { text: "다른 참가자들이 실험을 거부하고 나가는 모습을 보았을 때", correct: false, feedback: "동조자가 불복종하면 피험자의 복종률도 급격히 떨어집니다." },
                { text: "전기 충격의 강도를 15볼트씩 아주 조금씩 올리는 절차 그 자체", correct: true, feedback: "정답입니다! '점진적인 강도 증가(문간에 발 들여놓기)'는 복종을 '유도'하는 요인입니다. 이는 복종률을 낮추는 요인이 아니라, 실험실이든 현실이든 사람들이 복종하게 만드는 핵심 메커니즘입니다." }
            ]
        },
        {
            id: 9,
            question: "스트레스 대처(Coping) 방식에 대한 가장 올바른 태도는?",
            options: [
                { text: "무조건 문제 중심적 대처가 정서 중심적 대처보다 우월하다.", correct: false, feedback: "상황에 따라 다릅니다. 통제 불가능한 상황에서는 정서 중심 대처가 더 효과적일 수 있습니다." },
                { text: "스트레스 상황은 피하는 것이 상책이므로 회피 대처만 사용한다.", correct: false, feedback: "지속적인 회피는 문제를 악화시킬 수 있습니다." },
                { text: "상황의 통제 가능성에 따라 문제 중심 대처와 정서 중심 대처를 유연하게 활용한다.", correct: true, feedback: "정답입니다! 해결 가능한 문제는 적극적으로 해결하고(문제 중심), 통제 불가능한 문제는 감정을 조절하는(정서 중심) 유연성이 가장 중요합니다." },
                { text: "타인에게 도움을 요청하는 사회적 지지 추구는 의존적이므로 피해야 한다.", correct: false, feedback: "사회적 지지는 스트레스 완충 효과가 있는 매우 중요한 자원입니다." },
                { text: "모든 스트레스는 마음먹기 나름이므로 인지적 재해석만 하면 해결된다.", correct: false, feedback: "실질적인 문제 해결 행동이 필요한 경우도 많습니다." }
            ]
        },
        {
            id: 10,
            question: "다음 중 '상대적 박탈감'이 발생할 가능성이 가장 높은 구체적인 상황은?",
            options: [
                { text: "은퇴 후 연금으로 소박하지만 평온하게 사는 노부부", correct: false, feedback: "만족감이 높은 상태이므로 박탈감이 적습니다." },
                { text: "승진 심사에서 자신은 탈락하고, 입사 동기가 승진하여 팀장이 된 상황", correct: true, feedback: "정답입니다! 가장 가까운 비교 대상(준거 집단)인 동기와의 격차는 상대적 박탈감을 가장 강하게 유발합니다." },
                { text: "자신이 좋아하는 취미 생활에 몰입하여 시간 가는 줄 모르는 사람", correct: false, feedback: "내적 동기에 몰입한 상태로 비교가 일어나지 않습니다." },
                { text: "아무런 정보 없이 낯선 나라에 이민을 가서 고생하는 초기 정착민", correct: false, feedback: "비교 대상이 명확하지 않거나 생존 적응 단계일 수 있습니다." },
                { text: "복권에 당첨되어 갑자기 큰돈이 생긴 사람", correct: false, feedback: "오히려 상대적 우월감을 느낄 가능성이 높습니다." }
            ]
        }
    ];

    const quizArea = document.getElementById('quiz-area');

    quizData.forEach((q, index) => {
        // Create Card
        const card = document.createElement('div');
        card.className = 'question-card';

        // Question Title
        const qNum = document.createElement('span');
        qNum.className = 'question-number';
        qNum.textContent = `문제 ${q.id}`;
        card.appendChild(qNum);

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = q.question;
        card.appendChild(qText);

        // Options List
        const optionsList = document.createElement('ul');
        optionsList.className = 'options';

        // Feedback Container (Created beforehand to append after options)
        const feedbackDiv = document.createElement('div');
        feedbackDiv.className = 'feedback';
        const feedbackTitle = document.createElement('span');
        feedbackTitle.className = 'feedback-title';
        const feedbackContent = document.createElement('span');
        feedbackDiv.appendChild(feedbackTitle);
        feedbackDiv.appendChild(feedbackContent);

        q.options.forEach((opt, optIndex) => {
            const li = document.createElement('li');
            li.className = 'option-item';

            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span style="font-weight:bold; margin-right:10px;">${optIndex + 1}.</span> ${opt.text}`;
            
            // Click Event
            btn.onclick = () => {
                // Reset all buttons in this card
                const allBtns = optionsList.querySelectorAll('.option-btn');
                allBtns.forEach(b => {
                    b.classList.remove('selected', 'correct-choice', 'incorrect-choice');
                });

                // Style clicked button
                btn.classList.add('selected');
                if (opt.correct) {
                    btn.classList.add('correct-choice');
                    feedbackDiv.className = 'feedback correct';
                    feedbackTitle.textContent = "⭕ 정답입니다!";
                } else {
                    btn.classList.add('incorrect-choice');
                    feedbackDiv.className = 'feedback incorrect';
                    feedbackTitle.textContent = "❌ 오답입니다.";
                }

                // Show Feedback
                feedbackContent.textContent = opt.feedback;
                feedbackDiv.style.display = 'block';
            };

            li.appendChild(btn);
            optionsList.appendChild(li);
        });

        card.appendChild(optionsList);
        card.appendChild(feedbackDiv);
        quizArea.appendChild(card);
    });
</script>

</body>
</html>
