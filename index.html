                            { q: "적대적 반항장애의 세 가지 범주 중, 악의적인 복수심을 표출하는 범주는 ( <span class='fill-in-text'>(빈칸)</span> ) 범주이다.", correct: ['복수심'], display: '복수심' }
                        ]
                    }
                ]
            }
        };

        let currentQuizId = 1;

        function checkAnswer(quizId, questionIndex, inputId) {
            const inputElement = document.getElementById(inputId);
            const resultElement = document.getElementById('result-' + inputId);
            const rawUserValue = inputElement.value.trim();
            
            const questionData = quizData[quizId].sections.flatMap(sec => sec.questions)[questionIndex];
            
            if (rawUserValue === '') {
                resultElement.style.display = 'block';
                resultElement.className = 'result warning';
                resultElement.innerHTML = '⚠️ **입력값이 비어 있습니다. 정답을 입력해 주세요.**';
                return;
            }
            
            const userAnswer = normalizeAnswer(rawUserValue);
            const correctArray = questionData.correct.map(normalizeAnswer);
            const displayAnswer = questionData.display;

            resultElement.style.display = 'block';

            if (correctArray.includes(userAnswer)) {
                resultElement.className = 'result correct';
                resultElement.innerHTML = '✅ **정답입니다!**';
            } else {
                resultElement.className = 'result incorrect';
                resultElement.innerHTML = '❌ **오답입니다.** 정답: <span class="answer-text">' + displayAnswer + '</span>';
            }
        }

        function renderQuiz(quizId) {
            const data = quizData[quizId];
            let html = `<h1>${data.title}</h1>`;
            let globalQIndex = 0;

            data.sections.forEach(section => {
                html += `<h2 class="section-title">${section.title}</h2>`;
                section.questions.forEach((q, localIndex) => {
                    const inputId = `q${quizId}-${globalQIndex}`;
                    const questionNumber = globalQIndex + 1;
                    
                    html += `
                        <div class="question-box">
                            <div class="question-title">${questionNumber}. ${q.q}</div>
                            <input type="text" id="${inputId}" placeholder="정답 입력 (띄어쓰기 무관)" onkeypress="if(event.key==='Enter') checkAnswer(${quizId}, ${globalQIndex}, '${inputId}')">
                            <button class="check-btn" onclick="checkAnswer(${quizId}, ${globalQIndex}, '${inputId}')">정답 확인</button>
                            <div id="result-${inputId}" class="result"></div>
                        </div>
                    `;
                    globalQIndex++;
                });
            });

            document.getElementById('quiz-area').innerHTML = html;
        }

        function changeQuiz(quizId) {
            // Update tabs
            const tabs = document.querySelectorAll('.quiz-navigation button');
            tabs.forEach(tab => tab.classList.remove('current-tab'));
            document.getElementById(`tab-${quizId}`).classList.add('current-tab');
            
            currentQuizId = quizId;
            renderQuiz(quizId);
        }

        // Initialize quiz on load
        window.onload = function() {
            changeQuiz(currentQuizId);
        };
    </script>

</body>
